name: Build Windows desktop prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: node desktop/build-agent.mjs
      - run: dotnet restore desktop/Omni.Desktop.csproj --locked-mode
      - run: dotnet build desktop/Omni.Desktop.csproj -c Release --no-restore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omni-desktop-windows-x64-prototype
          path: |
            desktop/bin/Release/net48/*.exe
            desktop/bin/Release/net48/*.dll
            desktop/bin/Release/net48/*.config
            LICENSE
            desktop/README.md
