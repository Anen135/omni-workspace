name: Build Windows desktop prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: node desktop/build-agent.mjs
      - run: dotnet restore desktop/Omni.Desktop.csproj --locked-mode
      - run: dotnet build desktop/Omni.Desktop.csproj -c Release --no-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omni-desktop-windows-x64-prototype
          path: |
            desktop/bin/Release/net48/*.exe
            desktop/bin/Release/net48/*.dll
            desktop/bin/Release/net48/*.config
            LICENSE
            desktop/README.md
